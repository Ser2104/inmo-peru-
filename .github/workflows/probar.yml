name: probar
on:
  workflow_dispatch:
    inputs:
      tarea:
        description: probar | renormalizar
        default: probar
      urls:
        description: URLs separadas por espacio
        default: ""
      fuentes:
        description: fuentes separadas por espacio
        default: ""
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscador gratis (SearXNG)
        run: |
          docker run -d --name searxng -p 8080:8080 -v "$PWD/searxng:/etc/searxng" searxng/searxng:latest
          for i in $(seq 1 30); do curl -sf "http://localhost:8080/search?q=test&format=json" >/dev/null && break; sleep 2; done
      - run: python -m inmo.cli ${{ inputs.tarea }} --urls ${{ inputs.urls }} --fuentes ${{ inputs.fuentes }}
