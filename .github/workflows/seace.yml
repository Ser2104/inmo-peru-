name: seace
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      ver:
        description: "si: solo mostrar lo que devuelve SEACE"
        default: ""
jobs:
  leer:
    runs-on: [self-hosted, arequipa]
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q -r requirements.txt
      - if: inputs.ver == 'si'
        run: python herramientas/ver_seace.py
      - if: inputs.ver != 'si'
        run: python -m inmo.cli oportunidades --fuentes seace
