name: latido
on:
  schedule:
    - cron: "10 12 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .github/latido
          git config user.name "latido-bot"
          git config user.email "latido-bot@users.noreply.github.com"
          git add .github/latido
          git commit -m "Latido mensual para que GitHub no apague los flujos programados" && git push
