name: vigilante
on:
  schedule:
    - cron: "40 */2 * * *"
  workflow_dispatch:
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INMO_API_URL: ${{ vars.INMO_API_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m inmo.cli vigilar
      - name: Avisar si Supabase no responde
        if: failure()
        run: |
          [ -z "$TELEGRAM_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="🚨 El vigilante no pudo correr (¿Supabase pausado o caído?): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
