name: acelerar
on:
  workflow_dispatch:
jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MINUTOS_POR_PASO: "150"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscador gratis (SearXNG)
        run: |
          docker run -d --name searxng -p 8080:8080 -v "$PWD/searxng:/etc/searxng" searxng/searxng:latest
          for i in $(seq 1 30); do curl -sf "http://localhost:8080/search?q=test&format=json" >/dev/null && break; sleep 2; done
      - run: python -m inmo.cli acelerar --parte ${{ matrix.parte }} --partes 8
  analizar:
    needs: parte
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: for t in renormalizar auditar ubicar analizar; do python -m inmo.cli $t; done
