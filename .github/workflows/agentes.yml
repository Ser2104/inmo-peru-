name: agentes
on:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "30 7 * * *"
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      tarea:
        description: ciclo | completo | bcrp | buscar | explorar | verificar | temporal | rastrear | analizar | auditar | alertas | mejorar | vigilar | diagnostico
        default: ciclo
concurrency: agentes
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      issues: write
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      AIRROI_API_KEY: ${{ secrets.AIRROI_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscador gratis (SearXNG)
        run: |
          docker run -d --name searxng -p 8080:8080 -v "$PWD/searxng:/etc/searxng" searxng/searxng:latest
          for i in $(seq 1 30); do curl -sf "http://localhost:8080/search?q=test&format=json" >/dev/null && break; sleep 2; done
      - name: Elegir tarea
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            "30 7 * * *") echo "tareas=bcrp temporal buscar explorar explorar rastrear mejorar" >> $GITHUB_OUTPUT ;;
            "0 9 * * 0") echo "tareas=completo" >> $GITHUB_OUTPUT ;;
            "") echo "tareas=${{ inputs.tarea }}" >> $GITHUB_OUTPUT ;;
            *) echo "tareas=ciclo" >> $GITHUB_OUTPUT ;;
          esac
      - run: for t in ${{ steps.t.outputs.tareas }}; do python -m inmo.cli $t; done
      - name: Avisar si el flujo se cayó
        if: failure() || cancelled()
        run: |
          [ -z "$TELEGRAM_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="🚨 El flujo de agentes falló: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
